<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>rently. — set up your room without owning any of it</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --cream: #F5F1E7; --cream-card: #ECE5D3; --ink: #152E29; --ink-soft: #4A605A; --ink-faint: #7C8C86;
    --magenta: #D6336C; --magenta-dark: #AF1F52; --magenta-tint: #F6DCE5; --line: rgba(21,46,41,0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; line-height: 1.5; }
  .rn-display { font-family: 'Big Shoulders Display', 'Inter', sans-serif; font-weight: 800; letter-spacing: -0.01em; }
  .rn-logo { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .rn-logo-badge { background: var(--ink); color: #fff; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; flex-shrink: 0; }
  .rn-logo-word { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 22px; color: var(--ink); }
  .rn-dot { color: var(--magenta); }
  .rn-header { position: sticky; top: 0; z-index: 40; background: rgba(245,241,231,0.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .rn-header-inner { max-width: 1160px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .rn-nav { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .rn-nav-btn { background: transparent; border: none; font-family: 'Inter'; font-weight: 600; font-size: 14.5px; color: var(--ink-soft); padding: 9px 13px; border-radius: 999px; cursor: pointer; }
  .rn-nav-btn:hover { background: var(--cream-card); color: var(--ink); }
  .rn-nav-btn.active { background: var(--ink); color: var(--cream); }
  .rn-header-right { display: flex; align-items: center; gap: 10px; }
  .rn-my-rently { background: var(--magenta); color: #fff; border: none; font-family: 'Inter'; font-weight: 700; font-size: 13.5px; padding: 9px 16px; border-radius: 999px; cursor: pointer; }
  .rn-my-rently:hover { background: var(--magenta-dark); }
  .rn-logout { background: none; border: none; color: var(--ink-soft); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .rn-main { max-width: 1160px; margin: 0 auto; padding: 0 24px 90px; }
  .rn-btn { font-family: 'Inter'; font-weight: 600; font-size: 15px; border-radius: 10px; border: none; padding: 13px 22px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .rn-btn-primary { background: var(--magenta); color: #fff; }
  .rn-btn-primary:hover { background: var(--magenta-dark); }
  .rn-btn-primary:disabled { background: var(--ink-faint); cursor: not-allowed; }
  .rn-btn-dark { background: var(--ink); color: var(--cream); }
  .rn-btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .rn-btn-ghost:hover { background: var(--ink); color: var(--cream); }
  .rn-hero { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; padding: 60px 0 30px; align-items: center; }
  .rn-eyebrow-row { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 14px; font-weight: 600; margin-bottom: 18px; }
  .rn-hero h1 { font-size: 56px; line-height: 0.98; margin: 0 0 22px; }
  .rn-hero p.lead { font-size: 18px; color: var(--ink-soft); max-width: 480px; margin: 0 0 30px; }
  .rn-hero-actions { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
  .rn-stat-row { display: flex; gap: 28px; flex-wrap: wrap; }
  .rn-stat b { font-family: 'Big Shoulders Display'; font-weight: 800; font-size: 26px; display: block; }
  .rn-stat span { font-size: 13px; color: var(--ink-soft); }
  .rn-kit-panel { background: var(--ink); border-radius: 20px; padding: 26px; }
  .rn-kit-label { color: var(--cream); font-size: 13px; font-weight: 600; opacity: 0.75; margin-bottom: 16px; display: block; }
  .rn-kit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rn-kit-chip { background: rgba(245,241,231,0.06); border: 1px solid rgba(245,241,231,0.14); border-radius: 12px; padding: 14px; color: var(--cream); }
  .rn-kit-chip .rn-item-icon { background: rgba(214,51,108,0.18); color: #F3A9C4; margin-bottom: 10px; }
  .rn-kit-chip-name { font-size: 13.5px; font-weight: 600; }
  .rn-kit-chip-price { font-size: 12px; color: rgba(245,241,231,0.6); margin-top: 2px; }
  .rn-kit-price-tag { margin-top: 14px; background: var(--magenta); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .rn-kit-price-tag b { color: #fff; font-family: 'Big Shoulders Display'; font-size: 22px; }
  .rn-kit-price-tag span { color: rgba(255,255,255,0.85); font-size: 12.5px; }
  .rn-semester-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--cream-card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 20px; margin: 20px 0; flex-wrap: wrap; }
  .rn-semester-bar b { font-family: 'Big Shoulders Display'; font-size: 15px; }
  .rn-semester-inputs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rn-semester-inputs input[type=date] { font-family: 'Inter'; font-size: 13.5px; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
  .rn-link-btn { background: none; border: none; color: var(--magenta-dark); font-weight: 600; font-size: 13.5px; cursor: pointer; padding: 0; }
  .rn-section { padding: 50px 0; border-top: 1px solid var(--line); }
  .rn-section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }
  .rn-section-head h2 { font-size: 32px; margin: 0; max-width: 620px; }
  .rn-section-head p { color: var(--ink-soft); font-size: 15px; max-width: 340px; margin: 0; }
  .rn-trust-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .rn-trust-card { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: #fff; }
  .rn-trust-card .rn-item-icon { margin-bottom: 14px; }
  .rn-trust-card h4 { font-size: 15.5px; margin: 0 0 6px; }
  .rn-trust-card p { font-size: 13.5px; color: var(--ink-soft); margin: 0; }
  .rn-flow { display: flex; align-items: stretch; justify-content: space-between; gap: 8px; }
  .rn-flow-step { flex: 1; border: 1px solid var(--line); border-radius: 14px; padding: 18px 12px; background: #fff; text-align: center; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .rn-flow-arrow { color: var(--ink-faint); flex-shrink: 0; align-self: center; }
  .rn-layers { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .rn-layer-row { display: grid; grid-template-columns: 160px 1fr 220px; gap: 20px; padding: 22px 24px; align-items: center; }
  .rn-layer-row + .rn-layer-row { border-top: 1px solid var(--line); }
  .rn-layer-row.accent { background: var(--cream-card); }
  .rn-layer-name { font-family: 'Big Shoulders Display'; font-weight: 800; font-size: 22px; }
  .rn-layer-desc { color: var(--ink-soft); font-size: 14.5px; }
  .rn-layer-role { font-size: 13px; font-weight: 600; color: var(--ink); text-align: right; }
  .rn-teaser-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .rn-teaser-card { border: 1px solid var(--line); border-radius: 18px; padding: 26px; background: #fff; display: flex; flex-direction: column; }
  .rn-teaser-card h3 { font-size: 21px; margin: 10px 0 8px; }
  .rn-teaser-card p { color: var(--ink-soft); font-size: 14px; margin: 0 0 16px; flex-grow: 1; }
  .rn-feed { border: 1px solid var(--line); border-radius: 16px; background: #fff; overflow: hidden; }
  .rn-feed-row { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
  .rn-feed-row + .rn-feed-row { border-top: 1px solid var(--line); }
  .rn-feed-kind { font-size: 12px; font-weight: 600; color: var(--magenta-dark); display: flex; align-items: center; gap: 6px; }
  .rn-verified { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-soft); font-weight: 600; }
  .rn-feed-title { font-size: 14.5px; font-weight: 600; margin-top: 2px; }
  .rn-feed-meta { margin-left: auto; font-family: 'Big Shoulders Display'; font-size: 16px; color: var(--ink-soft); }
  .rn-final-cta { display: flex; align-items: center; justify-content: space-between; background: var(--ink); border-radius: 20px; padding: 40px 44px; gap: 24px; flex-wrap: wrap; }
  .rn-final-cta h3 { color: var(--cream); font-size: 30px; margin: 0 0 8px; max-width: 460px; }
  .rn-final-cta p { color: rgba(245,241,231,0.65); margin: 0; font-size: 15px; }
  .rn-page-head { padding: 36px 0 26px; }
  .rn-page-head h1 { font-size: 40px; margin: 0 0 10px; }
  .rn-page-head p { color: var(--ink-soft); font-size: 15.5px; max-width: 560px; margin: 0; }
  .rn-item-icon { background: var(--magenta-tint); color: var(--magenta-dark); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .rn-tone-ink { background: rgba(21,46,41,0.08); color: var(--ink); }
  .rn-build-grid { display: grid; grid-template-columns: 1fr 340px; gap: 32px; padding: 6px 0 60px; align-items: start; }
  .rn-cat-row { border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 14px; background: #fff; }
  .rn-cat-label { font-family: 'Big Shoulders Display'; font-weight: 800; font-size: 20px; margin-bottom: 14px; display: block; }
  .rn-cat-items { display: flex; gap: 10px; flex-wrap: wrap; }
  .rn-chip { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  .rn-chip:hover { border-color: var(--ink-faint); }
  .rn-chip.selected { border-color: var(--magenta); background: var(--magenta-tint); }
  .rn-chip-check { color: var(--ink-faint); display: flex; }
  .rn-chip.selected .rn-chip-check { color: var(--magenta-dark); }
  .rn-chip-name { font-size: 14px; font-weight: 600; display: block; }
  .rn-chip-price { font-size: 12px; color: var(--ink-soft); }
  .rn-chip-low { color: var(--magenta-dark); font-weight: 600; }
  .rn-summary-card { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: var(--cream-card); position: sticky; top: 90px; }
  .rn-summary-row { display: flex; justify-content: space-between; font-size: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .rn-summary-row:last-of-type { border-bottom: none; }
  .rn-summary-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 14px; border-top: 1.5px solid var(--ink); }
  .rn-summary-total b { font-family: 'Big Shoulders Display'; font-size: 26px; }
  .rn-upsell { margin-top: 14px; padding: 12px 14px; background: #fff; border: 1px dashed var(--magenta); border-radius: 10px; font-size: 12.5px; color: var(--ink-soft); }
  .rn-upsell button { margin-top: 8px; width: 100%; }
  .rn-error { color: var(--magenta-dark); font-size: 13.5px; margin-top: 10px; font-weight: 600; }
  .rn-note { color: var(--ink-soft); font-size: 13px; margin-top: 10px; }
  .rn-booking-grid { display: grid; grid-template-columns: 1fr 340px; gap: 32px; padding: 16px 0 60px; align-items: start; }
  .rn-form-card { border: 1px solid var(--line); border-radius: 16px; padding: 26px; background: #fff; }
  .rn-form-card h3 { font-size: 20px; margin: 0 0 18px; }
  .rn-field { margin-bottom: 16px; }
  .rn-field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .rn-field input { width: 100%; font-family: 'Inter'; font-size: 14.5px; padding: 11px 13px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--cream); color: var(--ink); }
  .rn-field input:focus { outline: 2px solid var(--magenta); outline-offset: 1px; border-color: var(--magenta); }
  .rn-confirm-wrap { max-width: 520px; margin: 60px auto; text-align: center; }
  .rn-confirm-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--magenta-tint); color: var(--magenta-dark); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
  .rn-confirm-wrap h1 { font-size: 34px; margin: 0 0 10px; }
  .rn-confirm-wrap p { color: var(--ink-soft); margin: 0 0 26px; }
  .rn-receipt { border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; text-align: left; background: #fff; margin-bottom: 26px; }
  .rn-receipt-row { display: flex; justify-content: space-between; font-size: 14px; padding: 7px 0; }
  .rn-receipt-row b { font-family: 'Big Shoulders Display'; font-size: 16px; }
  .rn-dash-greeting { font-size: 32px; margin: 0 0 6px; }
  .rn-dash-sub { color: var(--ink-soft); font-size: 15px; margin: 0 0 28px; }
  .rn-dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 36px; }
  .rn-dash-card { border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; background: #fff; }
  .rn-dash-card.muted { opacity: 0.55; }
  .rn-dash-card .rn-item-icon { margin-bottom: 14px; }
  .rn-dash-card b { font-family: 'Big Shoulders Display'; font-size: 19px; display: block; }
  .rn-dash-card span { font-size: 12.5px; color: var(--ink-soft); }
  .rn-table-wrap { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; overflow-x: auto; }
  table.rn-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rn-table th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); padding: 13px 18px; background: var(--cream-card); white-space: nowrap; }
  table.rn-table td { padding: 14px 18px; border-top: 1px solid var(--line); vertical-align: middle; }
  .rn-status { font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; display: inline-block; white-space: nowrap; }
  .rn-status-pending { background: #F3E3C4; color: #8A6116; }
  .rn-status-confirmed { background: #DCE7E0; color: #2C5E45; }
  .rn-status-delivered { background: var(--magenta-tint); color: var(--magenta-dark); }
  .rn-status-returned { background: #E4E4E0; color: var(--ink-soft); }
  .rn-status-requested { background: #F3E3C4; color: #8A6116; }
  .rn-status-checked-in { background: var(--magenta-tint); color: var(--magenta-dark); }
  .rn-status-scheduled { background: #DCE7E0; color: #2C5E45; }
  .rn-status-completed { background: #E4E4E0; color: var(--ink-soft); }
  .rn-item-tags { display: flex; gap: 5px; flex-wrap: wrap; max-width: 260px; }
  .rn-item-tag { font-size: 11.5px; background: var(--cream-card); border-radius: 6px; padding: 3px 7px; color: var(--ink-soft); white-space: nowrap; }
  .rn-status-select { font-family: 'Inter'; font-size: 13px; padding: 7px 9px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--cream); }
  .rn-empty { text-align: center; padding: 70px 20px; color: var(--ink-soft); }
  .rn-stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 30px; }
  .rn-stat-card { border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; background: #fff; }
  .rn-stat-card .rn-item-icon { margin-bottom: 14px; }
  .rn-stat-card b { font-family: 'Big Shoulders Display'; font-size: 32px; display: block; }
  .rn-stat-card span { font-size: 13.5px; color: var(--ink-soft); }
  .rn-stat-card.warn b { color: var(--magenta-dark); }
  .rn-admin-section { margin-bottom: 40px; }
  .rn-admin-section h3 { font-size: 20px; margin: 0 0 16px; }
  .rn-inv-row { display: flex; align-items: center; gap: 14px; }
  .rn-stock-controls { display: flex; align-items: center; gap: 8px; }
  .rn-stock-controls button { width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--cream); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .rn-stock-num { font-family: 'Big Shoulders Display'; font-size: 17px; min-width: 26px; text-align: center; }
  .rn-simple-hero { padding: 40px 0 10px; max-width: 620px; }
  .rn-simple-hero h1 { font-size: 42px; margin: 0 0 14px; }
  .rn-simple-hero p { color: var(--ink-soft); font-size: 16px; margin: 0; }
  .rn-price-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 30px 0 10px; }
  .rn-price-card { border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: #fff; }
  .rn-price-card b { font-family: 'Big Shoulders Display'; font-size: 24px; display: block; margin-bottom: 4px; }
  .rn-price-card span { font-size: 13.5px; color: var(--ink-soft); }
  .rn-circles-head { background: var(--ink); border-radius: 20px; padding: 32px 34px; color: var(--cream); margin-bottom: 28px; }
  .rn-circles-head b { font-family: 'Big Shoulders Display'; font-size: 28px; display: block; margin-bottom: 4px; }
  .rn-circles-head span { color: rgba(245,241,231,0.65); font-size: 14px; }
  .rn-tag-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .rn-tag { background: rgba(245,241,231,0.12); border: 1px solid rgba(245,241,231,0.25); color: var(--cream); font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px; }
  .rn-auth-wrap { max-width: 400px; margin: 50px auto; border: 1px solid var(--line); border-radius: 18px; padding: 30px; background: #fff; }
  .rn-acct-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; margin-bottom: 20px; }
  .rn-acct-card { border: 1px solid var(--line); border-radius: 16px; padding: 24px; background: #fff; }
  .rn-acct-card h3 { font-size: 17px; margin: 0 0 16px; }
  .rn-acct-info-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rn-acct-info-row:last-child { border-bottom: none; }
  .rn-acct-info-row span:first-child { color: var(--ink-soft); }
  .rn-acct-info-row span:last-child { font-weight: 600; }
  .rn-role-badge { text-transform: capitalize; background: var(--cream-card); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .rn-auth-wrap h1 { font-size: 28px; margin: 0 0 6px; }
  .rn-auth-wrap p { color: var(--ink-soft); font-size: 14px; margin: 0 0 22px; }
  .rn-auth-toggle { display: flex; gap: 6px; margin-top: 16px; font-size: 13.5px; color: var(--ink-soft); }
  .rn-footer { border-top: 1px solid var(--line); padding: 30px 24px; display: flex; justify-content: space-between; align-items: center; color: var(--ink-soft); font-size: 13px; max-width: 1160px; margin: 0 auto; flex-wrap: wrap; gap: 10px; }
  .rn-loading { text-align: center; padding: 80px 20px; color: var(--ink-soft); }
  .rn-burger { display: none; background: none; border: none; cursor: pointer; color: var(--ink); padding: 6px; flex-shrink: 0; }

  /* ---- Tablet / small desktop ---- */
  @media (max-width: 880px) {
    .rn-hero { grid-template-columns: 1fr; padding-top: 30px; gap: 32px; }
    .rn-hero h1 { font-size: 38px; }
    .rn-trust-grid { grid-template-columns: 1fr 1fr; }
    .rn-flow { flex-direction: column; }
    .rn-flow-arrow { transform: rotate(90deg); align-self: center; }
    .rn-layer-row { grid-template-columns: 1fr; gap: 6px; }
    .rn-layer-role { text-align: left; }
    .rn-teaser-row { grid-template-columns: 1fr; }
    .rn-build-grid, .rn-booking-grid { grid-template-columns: 1fr; }
    .rn-summary-card { position: static; }
    .rn-dash-grid { grid-template-columns: 1fr 1fr; }
    .rn-stats-row { grid-template-columns: 1fr; }
    .rn-price-row { grid-template-columns: 1fr; }
    .rn-final-cta { flex-direction: column; align-items: flex-start; }
  }

  /* ---- Phone: collapse nav into a menu ---- */
  @media (max-width: 700px) {
    .rn-header-inner { padding: 12px 16px; flex-wrap: nowrap; position: relative; }
    .rn-burger { display: flex; order: 3; }
    .rn-header-right { order: 2; margin-left: auto; gap: 6px; }
    .rn-nav {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      background: var(--cream); border-bottom: 1px solid var(--line);
      flex-direction: column; align-items: stretch; gap: 2px;
      padding: 8px 16px 16px; box-shadow: 0 12px 20px rgba(21,46,41,0.08);
    }
    .rn-nav.open { display: flex; }
    .rn-nav-btn { text-align: left; padding: 12px 10px; font-size: 15.5px; }
    .rn-my-rently { font-size: 12.5px; padding: 8px 12px; }
    .rn-logout { font-size: 11.5px; }
  }

  async function confirmBooking() {
    if (!session) { setFormError("Log in or create an account to finish booking."); return; }
    if (!bookName.trim() || !bookBlock || !bookRoom.trim()) { setFormError("Add your name, hostel block and room number to start the booking."); return; }
    if (cartIds.length === 0) { setFormError("Pick at least one item before confirming."); return; }
    setBusy(true);
    let error, id;
    for (let attempt = 0; attempt < 3; attempt++) {
      id = "RNT-" + Math.floor(1000 + Math.random() * 9000);
      const res = await db.from("bookings").insert({
        id, student_id: session.user.id, student_name: bookName.trim(),
        hostel_block: bookBlock, room_info: bookRoom.trim(), delivery_slot: deliverySlot,
        items: cartIds, semester_start: semStart, semester_end: semEnd, status: "Pending",
      });
      error = res.error;
      if (!error || error.code !== "23505") break; // 23505 = duplicate booking id, try a fresh one
    }
    if (error) { setBusy(false); setFormError("Couldn't complete the booking: " + error.message); return; }
    const { error: profileErr } = await db.from("profiles").update({ full_name: bookName.trim(), room_info: bookRoom.trim(), hostel_block: bookBlock }).eq("id", session.user.id);
    if (profileErr) console.error("Profile update failed:", profileErr.message);
    for (const cid of cartIds) {
      const cur = stockOf(cid);
      const { error: stockErr } = await db.from("inventory").update({ stock: Math.max(0, cur - 1) }).eq("item_id", cid);
      if (stockErr) console.error("Stock update failed for", cid, stockErr.message);
    }
    await refreshInventory();
    await refreshMyBookings();
    setLastBookingId(id);
    setCartIds([]);
    setFormError("");
    setBusy(false);
    goTo("confirmation");

  else if (view === "dashboard") body = session ? DashboardView() : AuthForm({});
  else if (view === "account") body = session ? AccountView() : AuthForm({});
  else if (view === "admin") body = (profile && profile.role === "admin") ? AdminView() : h("div", { className: "rn-loading" }, "Admin access only.");
  else if (view === "transport") body = (profile && profile.role === "transporter") ? TransportView() : h("div", { className: "rn-loading" }, "Transport access only.");
  else if (view === "circles") body = CirclesView();
  else if (view === "storage") body = StorageView();
  else if (view === "moves") body = MovesView();
  else if (view === "auth") body = AuthForm({});

  return h("div", null,
    Header(),
    h("main", { className: "rn-main" }, body),
    h("footer", { className: "rn-footer" }, Logo(26), h("span", null, "Live pilot build \u00b7 backed by a real database \u00b7 built for the Rently pilot")),
    PolicyModal(policyOpen, () => setPolicyOpen(false))
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
