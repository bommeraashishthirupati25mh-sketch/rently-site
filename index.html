  async function confirmBooking() {
    if (!session) { setFormError("Log in or create an account to finish booking."); return; }
    if (!bookName.trim() || !bookBlock || !bookRoom.trim()) { setFormError("Add your name, hostel block and room number to start the booking."); return; }
    if (cartIds.length === 0) { setFormError("Pick at least one item before confirming."); return; }
    if (semStart < todayISO()) { setFormError("Your semester start date has passed. Go back to Rent and use Change dates to pick a new one."); return; }
    const outOfStock = cartIds.filter(cid => stockOf(cid) <= 0);
    if (outOfStock.length > 0) { setFormError("Sorry, this just sold out: " + outOfStock.map(cid => ITEM_DEFS[cid] ? ITEM_DEFS[cid].name : cid).join(", ") + ". Remove it to continue."); return; }
    setBusy(true);
    let error, id;
    const otp = String(Math.floor(100000 + Math.random() * 900000));
    for (let attempt = 0; attempt < 3; attempt++) {
      id = "RNT-" + Math.floor(1000 + Math.random() * 9000);
      const res = await db.from("bookings").insert({
        id, student_id: session.user.id, student_name: bookName.trim(),
        hostel_block: bookBlock, room_info: bookRoom.trim(), delivery_slot: deliverySlot,
        items: cartIds, semester_start: semStart, semester_end: semEnd, status: "Pending",
        pickup_otp: otp,
      });
      error = res.error;
      if (!error || error.code !== "23505") break; // 23505 = duplicate booking id, try a fresh one
    }
    if (error) { setBusy(false); setFormError("Couldn't complete the booking: " + error.message); return; }
    const { error: profileErr } = await db.from("profiles").update({ full_name: bookName.trim(), room_info: bookRoom.trim(), hostel_block: bookBlock }).eq("id", session.user.id);
    if (profileErr) console.error("Profile update failed:", profileErr.message);
    for (const cid of cartIds) {
      const { error: stockErr } = await db.rpc("decrement_item_stock", { p_item_id: cid });
      if (stockErr) console.error("Stock update failed for", cid, stockErr.message);
    }
    await refreshInventory();
    await refreshMyBookings();
    notifyWhatsApp("booking", id);
    setLastBookingId(id);
    setCartIds([]);
    setFormError("");
    setBusy(false);
    goTo("confirmation");
  }

  function storagePathFromUrl(url) {

  async function addItemImage(itemId, file) {

    const current = imagesOf(itemId);
    if (current.length >= MAX_ITEM_IMAGES) { alert("You can add up to " + MAX_ITEM_IMAGES + " photos per item. Remove one first."); return; }
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = itemId + "-" + Date.now() + "." + ext;
    const { error: upErr } = await db.storage.from("item-images").upload(path, file, { upsert: true });
    if (upErr) { alert("Couldn't upload image: " + upErr.message); return; }
    const { data } = db.storage.from("item-images").getPublicUrl(path);
    const { error } = await db.from("inventory").update({ image_urls: [...current, data.publicUrl] }).eq("item_id", itemId);
    if (error) { alert("Couldn't save image: " + error.message); return; }
    refreshInventory();
  }
  async function removeItemImage(itemId, url) {

    if (error) { alert("Couldn't remove image: " + error.message); return; }

  }

    const { data } = await db.from("whatsapp_log").select("id,created_at,kind,ref_id,via,ok,error_code,error,delivery_status").order("created_at", { ascending: false }).limit(8);

  function waCause(row) {
    if (!row) return "";
    if (row.error_code === 190) return "The WhatsApp access token has expired. Create a permanent System User token in Meta and update the WHATSAPP_TOKEN secret.";
    if (row.error_code === 131030) return "The recipient is not on the allowed list for the Meta test number. Add them in Meta, or move to a live number.";
    if (row.error_code === 131047) return "The 24-hour reply window has closed and no approved template was used. Create and approve the message templates in Meta.";
    if (row.error_code && String(row.error_code).startsWith("132")) return "A message template is missing or not approved yet in Meta.";
    return row.error || "The send failed. Check the message log.";
  }

  async function deleteContact(id) {

    refreshContact();
  }
  async function submitContact(e) {
    e.preventDefault();
    if (busy) return;
    const name = (contactName !== null ? contactName : (profile && profile.full_name) || "").trim();
    const email = (contactEmail !== null ? contactEmail : (session && session.user && session.user.email) || "").trim();
    const message = contactText.trim();
    if (!name) { setContactNote("Add your name so we know who to reply to."); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setContactNote("Add an email address we can reply to."); return; }
    if (message.length < 5) { setContactNote("Write a few words so we can help."); return; }
    if (contactHp) { setContactDone(true); return; }
    setBusy(true); setContactNote("");
    const { error } = await db.from("contact_messages").insert({ name: name.slice(0, 100), email: email.slice(0, 200), topic: contactTopic, message: message.slice(0, 2000), student_id: session ? session.user.id : null });
    setBusy(false);
    if (error) { setContactNote("Couldn't send your message: " + error.message + ". Please try again in a moment."); return; }
    setContactDone(true); setContactText("");
